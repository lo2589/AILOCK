[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailatch"
version = "0.1.1"
description = "AILatch (formerly AiLock) - encrypt files in place to protect from AI modifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lo2589" }]
keywords = ["ai", "ailatch", "ailock", "encryption", "privacy", "source-code", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=21.0",
    "cryptography>=41.0",
    "pyzipper>=0.3.6",
]

[project.urls]
Homepage = "https://github.com/lo2589/AILATCH"
Issues = "https://github.com/lo2589/AILATCH/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6.0"]

[project.scripts]
ailatch = "ailatch.cli:main"
ailock = "ailatch.cli:main"

[tool.setuptools.packages.find]
include = ["ailatch*", "aloc*"]
